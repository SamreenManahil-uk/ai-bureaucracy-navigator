services:

  mongo:
    image: mongo:8
    container_name: navigator-mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - navigator-mongo-data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: navigator-backend
    restart: unless-stopped

    depends_on:
      mongo:
        condition: service_healthy

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000

      MONGODB_URI: mongodb://mongo:27017/ai-bureaucracy-navigator

      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}

      OLLAMA_BASE_URL: http://host.docker.internal:11434

    extra_hosts:
      - "host.docker.internal:host-gateway"


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api

    container_name: navigator-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8080:80"


volumes:
  navigator-mongo-data:
